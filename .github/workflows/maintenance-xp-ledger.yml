# One-off maintenance, run by hand from the Actions tab.
#
# Builds an XP ledger for learners who earned XP before the ledger existed, so
# work already paid for cannot be claimed again. It also brings a learner's two
# score fields back together where they drifted, and removes the leftover
# learner profile of an admin account. It defaults to a read-only report;
# writing requires choosing "apply" explicitly.
#
# A learner who already has ledger entries is skipped, so running it twice is
# harmless. The job prints shortened user ids and counts, never a name, because
# run logs are readable by anyone with access to this repository's Actions.
#
# NOTE: the service account must hold the "Cloud Datastore User" role — grant it
# in Google Cloud IAM, and remove it again once the migration is finished.
name: Maintenance - build XP ledger

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report (read only) or apply (writes)"
        required: true
        default: report
        type: choice
        options:
          - report
          - apply

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Reads and writes Firestore with its own service account; it has no reason
    # to write anything back to the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Installed for this run only: the Admin SDK is a maintenance tool, not a
      # dependency of the app.
      - name: Install the Admin SDK
        run: npm i --no-save firebase-admin

      - name: Migrate
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEARNTOPIA_REACT }}
          MODE: ${{ inputs.mode }}
        run: |
          # The key file goes away even if the migration fails: a bare rm on the
          # last line never runs when the step exits non-zero.
          trap 'rm -f "$RUNNER_TEMP/gcp-key.json"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/gcp-key.json")
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          if [ "$MODE" = "apply" ]; then
            node scripts/migrate-xp-ledger.mjs --apply
          else
            node scripts/migrate-xp-ledger.mjs
          fi
