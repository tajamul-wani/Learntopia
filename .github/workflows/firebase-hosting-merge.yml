# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  # firestore.rules is the boundary protecting children's data, and this
  # workflow pushes it live on every merge with nothing checking it first.
  # The rules tests take about 75 seconds. That is cheap insurance on the most
  # dangerous automated action in this repository, so the rules deploy waits
  # for them.
  #
  # The hosting deploy does NOT wait. A bad front-end build is recoverable in
  # minutes; bad security rules are a data exposure. Branch protection on main
  # requires `test` and `rules-tests` to pass on the pull request, and requires
  # the branch to be current, so main is green before a merge happens at all.
  # The hosting build therefore has nothing left to prove and stays at a minute.
  #
  # The tests live in their own workflow file, so `needs:` cannot reach them.
  # This waits on the check run for this exact commit instead, and fails
  # closed: a failed, cancelled or absent check means no rules deploy, and the
  # reason is in the log.
  rules_gate:
    name: rules_gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
    steps:
      - name: Wait for the rules tests on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The check-run name is the job id in firestore-rules-tests.yml.
          # Renaming that job without changing this blocks the rules deploy,
          # which is the safe failure.
          required="rules-tests"
          deadline=$(( $(date +%s) + 10 * 60 ))

          while :; do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                     --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "none")"')
            line=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$required" '$1==n {print; exit}')

            if [ -n "$line" ]; then
              status=$(printf '%s' "$line" | cut -f2)
              conclusion=$(printf '%s' "$line" | cut -f3)
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "rules-tests passed. Deploying rules."
                  exit 0
                fi
                echo "::error::rules-tests concluded '$conclusion' on $SHA. Not deploying rules."
                exit 1
              fi
              echo "waiting: rules-tests is $status"
            else
              echo "waiting: rules-tests has not started"
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for rules-tests on $SHA."
              echo "Rules deploy skipped rather than published unverified."
              exit 1
            fi
            sleep 10
          done

  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          echo "VITE_API_KEY=${{ secrets.VITE_API_KEY }}" >> .env
          echo "VITE_MESSAGING_SENDER_ID=${{ secrets.VITE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_APP_ID=${{ secrets.VITE_APP_ID }}" >> .env
          # The AI tutor calls this Cloudflare Worker; without it the tutor
          # disables itself in the built app.
          echo "VITE_GEMINI_PROXY_URL=${{ secrets.VITE_GEMINI_PROXY_URL }}" >> .env
          # Optional hardening — blank until the secrets are added; features no-op when empty.
          echo "VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}" >> .env
          echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}" >> .env
          npm ci && npm run lint && npm run build
      # Deploy hosting via the official Firebase action. This is the fast,
      # reliable path (~1 min). Direct `npx firebase-tools deploy --only hosting`
      # in CI re-downloads the CLI each run and socket-hangs on upload, which
      # caused the ~16 min cancelled runs — do not switch back to it.
      - name: Deploy to Firebase Hosting Live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEARNTOPIA_REACT }}
          channelId: live
          projectId: learntopia-react

  # Deploy Firestore Security Rules on merge, so the live rules always match
  # firestore.rules in the repo. Authenticates with the same service account
  # secret used for hosting (no personal Firebase login required).
  # NOTE: the service account must have the "Firebase Rules Admin" role for
  # this to succeed — grant it in Google Cloud IAM if the deploy is denied.
  deploy_firestore_rules:
    needs: rules_gate
    runs-on: ubuntu-latest
    # Deploys with its own service account; it never writes to the repository.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy Firestore rules
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEARNTOPIA_REACT }}
        run: |
          # The key file goes away even if the deploy fails: a bare rm on the
          # last line never runs when the step exits non-zero.
          trap 'rm -f "$RUNNER_TEMP/gcp-key.json"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/gcp-key.json")
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project learntopia-react --non-interactive
