name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    # No Firebase secrets: the app under test runs against the local Auth and
    # Firestore emulators with a demo- project id, so it never reaches production.
    # The emulators are Java processes.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Install dependencies
      run: npm ci
    # Vitest: logic, components, and the palette guard that fails the build when
    # an off-palette colour or a hardcoded hex creeps into the UI. Seconds, and
    # it runs before the browsers are installed so an obvious break fails fast.
    - name: Unit and component tests
      run: npm run test:unit
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # Starts the emulators, runs the whole suite (signed-in specs included), then
    # shuts them down. The exit code is Playwright's, so a failing test fails CI.
    - name: Run Playwright tests
      run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
