name: Playwright Tests
# Pull requests only, deliberately.
#
# This used to run on push to main as well, which meant the same 174 tests ran
# twice on every change: once against the merge result on the pull request,
# and again on the merge commit ten minutes later. The second run gated
# nothing - the deploy workflow did not wait for it - so it cost about ten CI
# minutes per merge and could only ever tell us something we already knew.
#
# What makes dropping it safe is the `main protection` ruleset, which requires
# this job (`test`) and `rules-tests` to pass, and requires the branch to be
# up to date, so the tree that was tested is the tree that gets merged. main
# is green by construction; re-proving it afterwards is not coverage.
#
# If that ruleset is ever removed, put the push trigger back.
on:
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    # No Firebase secrets: the app under test runs against the local Auth and
    # Firestore emulators with a demo- project id, so it never reaches production.
    # The emulators are Java processes.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Install dependencies
      run: npm ci
    # Vitest: logic, components, and the palette guard that fails the build when
    # an off-palette colour or a hardcoded hex creeps into the UI. Seconds, and
    # it runs before the browsers are installed so an obvious break fails fast.
    - name: Unit and component tests
      run: npm run test:unit
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # Starts the emulators, runs the whole suite (signed-in specs included), then
    # shuts them down. The exit code is Playwright's, so a failing test fails CI.
    - name: Run Playwright tests
      run: npm run test:e2e
    # A flaky test passes on retry and Playwright exits 0, so a real failure
    # can sit inside a green run with nobody the wiser. This puts a warning on
    # the pull request and a table in the job summary. It never fails the
    # build: the owner chose to keep retries and surface the flake instead.
    - name: Surface flaky tests
      if: ${{ !cancelled() }}
      run: node scripts/report-flaky.mjs
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
