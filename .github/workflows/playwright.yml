name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    # No Firebase secrets: the app under test runs against the local Auth and
    # Firestore emulators with a demo- project id, so it never reaches production.
    # The emulators are Java processes.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Install dependencies
      run: npm ci
    # Fails the build if an off-palette colour or hardcoded hex creeps into the UI.
    - name: Palette guard
      run: npm run test:palette
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # Starts the emulators, runs the whole suite (signed-in specs included), then
    # shuts them down. The exit code is Playwright's, so a failing test fails CI.
    - name: Run Playwright tests
      run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
