    <!-- Instant paint: dark ground + splash styles apply before any JS loads,
         so the very first frame is branded instead of a blank white screen. -->
    <style>
      html, body { margin: 0; background: #0A0C12; }
      /* Cold-boot loader (shared by the inline splash + React AppLoader via .app-splash). */
      .app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; background: #0A0C12;
        font-family: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .app-splash .stage { position: relative; width: 104px; height: 104px; }
      .app-splash .mark {
        position: absolute; inset: 0; margin: auto; width: 52px; height: 52px;
        filter: drop-shadow(0 0 18px rgba(139,124,246,0.55));
        animation: lt-pulse 2s ease-in-out infinite;
      }
      .app-splash .orbit { position: absolute; inset: 0; animation: lt-spin 1.4s linear infinite; }
      .app-splash .orbit span {
        position: absolute; top: 50%; left: 50%; width: 11px; height: 11px;
        margin: -5.5px 0 0 -5.5px; border-radius: 50%;
      }
      .app-splash .orbit span:nth-child(1) { transform: rotate(0deg)   translateX(48px); background: #8B7CF6; box-shadow: 0 0 12px rgba(139,124,246,0.7); }
      .app-splash .orbit span:nth-child(2) { transform: rotate(120deg) translateX(48px); background: #4EC5E8; box-shadow: 0 0 12px rgba(78,197,232,0.7); }
      .app-splash .orbit span:nth-child(3) { transform: rotate(240deg) translateX(48px); background: #C4BCF9; box-shadow: 0 0 12px rgba(196,188,249,0.6); }
      .app-splash .word { display: flex; align-items: center; font-size: 15px; font-weight: 800; }
      .app-splash .word b {
        background: linear-gradient(90deg, #C4BCF9, #4EC5E8);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .app-splash .word i { width: 4px; height: 4px; border-radius: 50%; background: #8B7CF6; margin-left: 4px; animation: lt-bounce 1s infinite; }
      .app-splash .word i:nth-of-type(2) { animation-delay: 0.15s; }
      .app-splash .word i:nth-of-type(3) { animation-delay: 0.30s; }
      @keyframes lt-spin { to { transform: rotate(360deg); } }
      @keyframes lt-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.92; } }
      @keyframes lt-bounce { 0%, 100% { transform: translateY(0); opacity: 0.45; } 50% { transform: translateY(-5px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .app-splash .orbit, .app-splash .mark, .app-splash .word i { animation: none; }
      }
    </style>
